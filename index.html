<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food+ TCC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        .navbar {
            background-color: #2c3e50;
            padding: 10px 0;
        }

        .navbar ul {
            list-style: none;
            text-align: center;
        }

        .navbar ul li {
            display: inline;
            margin: 0 20px;
        }

        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .navbar ul li a:hover {
            color: #1abc9c;
        }

        .main-content {
            position: relative;
            height: calc(100vh - 120px); /* altura total menos navbar e rodapé */
        }

        .image-container {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 2;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
            padding: 0 20px;
        }

        .text-overlay h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .text-overlay p {
            font-size: 20px;
        }

        .footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px 0;
            height: 60px;
            line-height: 40px;
        }

        .footer p {
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">O Trabalho</a></li>
        </ul>
    </nav>

    <!-- Seção principal -->
    <section class="main-content">
        <div class="image-container">
            <img src="best-food-background-bpy8hme0nnwoxdwl.jpg" alt="Imagem do TCC">
        </div>
        <div class="text-overlay">
            <h1>Este é o site do nosso TCC: Food+!</h1>
            <p>Integrantes: Bryan Faria Rodrigues, Rian Rodrigues de Moura Alves e Thiago Lima dos Santos</p>
        </div>
    </section>

    <!-- Rodapé -->
    <footer class="footer">
        <p>CNW - 3ºB Grupo A - 2025</p>
    </footer>

</body>
</html>
